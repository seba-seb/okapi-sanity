<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Okapi">
  <title>Okapi</title>
  <!-- Neck with the okapi's stripes (the brand's signature: layers) -->
  <path d="M78 150 C82 172 80 188 74 200 L126 200 C120 188 118 172 122 150 Z" fill="#2B1510"/>
  <g fill="none" stroke="#F1E4CF" stroke-width="6" stroke-linecap="round">
    <path d="M81 181 C93 177 107 177 119 181"/>
    <path d="M78 194 C92 190 108 190 122 194"/>
  </g>
  <!-- Ears -->
  <ellipse cx="50" cy="74" rx="36" ry="17" transform="rotate(-28 50 74)" fill="#7B3420"/>
  <ellipse cx="53" cy="75" rx="23" ry="8" transform="rotate(-28 53 75)" fill="#F1E4CF"/>
  <ellipse cx="150" cy="74" rx="36" ry="17" transform="rotate(28 150 74)" fill="#7B3420"/>
  <ellipse cx="147" cy="75" rx="23" ry="8" transform="rotate(28 147 75)" fill="#F1E4CF"/>
  <!-- Ossicones -->
  <rect x="80" y="20" width="12" height="32" rx="6" transform="rotate(-12 86 36)" fill="#7B3420"/>
  <circle cx="83" cy="23" r="6" fill="#2B1510"/>
  <rect x="108" y="20" width="12" height="32" rx="6" transform="rotate(12 114 36)" fill="#7B3420"/>
  <circle cx="117" cy="23" r="6" fill="#2B1510"/>
  <!-- Head -->
  <path d="M100 40 C131 40 147 58 147 85 C147 107 139 125 131 143 C125 159 117 173 100 173 C83 173 75 159 69 143 C61 125 53 107 53 85 C53 58 69 40 100 40 Z" fill="#7B3420"/>
  <!-- Pale cheeks and jaw -->
  <path d="M57 97 C63 121 75 141 83 159 C87 168 93 173 100 173 C107 173 113 168 117 159 C125 141 137 121 143 97 C131 107 118 111 100 111 C82 111 69 107 57 97 Z" fill="#F1E4CF"/>
  <!-- Dark blaze from forehead to muzzle -->
  <path d="M90 47 C94 43 106 43 110 47 C113 80 113 120 111 151 C110 163 106 169 100 169 C94 169 90 163 89 151 C87 120 87 80 90 47 Z" fill="#2B1510"/>
  <!-- Nostrils -->
  <ellipse cx="95" cy="158" rx="2.4" ry="3.6" transform="rotate(14 95 158)" fill="#F1E4CF"/>
  <ellipse cx="105" cy="158" rx="2.4" ry="3.6" transform="rotate(-14 105 158)" fill="#F1E4CF"/>
  <!-- The okapi's long blue tongue (the brand accent) -->
  <path d="M99 165 C104 170 111 172 118 171 C125 170 129 174 127 179 C125 184 118 183 115 179 C112 175 104 172 98 170 Z" fill="#4F5BFF"/>
  <!-- Eyes -->
  <ellipse cx="73" cy="92" rx="6.5" ry="8" fill="#2B1510"/>
  <circle cx="75" cy="89" r="2" fill="#FBF6EC"/>
  <ellipse cx="127" cy="92" rx="6.5" ry="8" fill="#2B1510"/>
  <circle cx="129" cy="89" r="2" fill="#FBF6EC"/>
</svg>
